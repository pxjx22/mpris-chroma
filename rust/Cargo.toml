[package]
name = "mpris-chroma"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# Dependencies are added as the modules that need them are ported (see
# README.md for the order), so nothing here is compiled before it is used.
[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
log = "0.4"
sha2 = "0.10"
signal-hook = "0.3"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
url = "2.5.8"
wait-timeout = "0.2.1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
