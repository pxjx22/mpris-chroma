name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # dbus-daemon runs the D-Bus tests and the real-binary end-to-end test
      # on a private bus (they skip themselves where it is missing).
      - name: Install dbus-daemon
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus-daemon

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
